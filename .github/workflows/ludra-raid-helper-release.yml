name: Ludra Raid Helper Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'ludra-v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        working-directory: apps/ludra-raid-helper
        run: npm install --no-audit --no-fund

      - name: Build Windows app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        working-directory: apps/ludra-raid-helper
        run: npm run desktop:package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludra-raid-helper-windows
          path: apps/ludra-raid-helper/dist/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: apps/ludra-raid-helper/dist/*.exe
