<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080706">
  <title>Aetherion — Animated Logo Preview</title>
  <style>
    :root { color-scheme: dark; background: #080706; color: #f3eee8; font-family: "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse at 50% 55%, #1c100b 0, #0b0908 42%, #050505 78%); }
    .scene { position: relative; display: grid; width: min(100vw, 100vh); aspect-ratio: 1; place-items: center; isolation: isolate; }
    .aura { position: absolute; z-index: -2; width: 73%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, #ff5b1026 0%, #d42b0c12 41%, transparent 72%); filter: blur(22px); animation: aura 4.8s ease-in-out infinite; }
    .logo { width: 100%; height: 100%; object-fit: contain; animation: breathe 4.8s ease-in-out infinite; }
    .sheen { position: absolute; inset: 6% 4%; z-index: 1; pointer-events: none; overflow: hidden; mix-blend-mode: screen; }
    .sheen::before { content: ""; position: absolute; top: -25%; bottom: -25%; left: -60%; width: 32%; transform: skewX(-18deg); background: linear-gradient(90deg, transparent, #fff3b714 38%, #fff8df55 50%, #ff7b1930 63%, transparent); filter: blur(8px); animation: sweep 6.5s cubic-bezier(.3,.1,.2,1) infinite; }
    .ember { position: absolute; z-index: 2; bottom: 17%; left: var(--x); width: var(--size); height: calc(var(--size) * 2.4); border-radius: 100%; opacity: 0; background: linear-gradient(#ffd989, #fa4810 55%, transparent); box-shadow: 0 0 10px #ff641d99; animation: rise var(--duration) linear var(--delay) infinite; }
    .ember:nth-of-type(1) { --x: 18%; --size: 3px; --duration: 4s; --delay: .1s; }
    .ember:nth-of-type(2) { --x: 29%; --size: 2px; --duration: 5.2s; --delay: 1.8s; }
    .ember:nth-of-type(3) { --x: 42%; --size: 3px; --duration: 4.7s; --delay: 2.4s; }
    .ember:nth-of-type(4) { --x: 55%; --size: 2px; --duration: 5.8s; --delay: .7s; }
    .ember:nth-of-type(5) { --x: 68%; --size: 3px; --duration: 4.4s; --delay: 3.1s; }
    .ember:nth-of-type(6) { --x: 80%; --size: 2px; --duration: 5.1s; --delay: 1.1s; }
    .ember:nth-of-type(7) { --x: 24%; --size: 2px; --duration: 6s; --delay: 3.6s; }
    .ember:nth-of-type(8) { --x: 74%; --size: 2px; --duration: 4.9s; --delay: 2s; }
    .label { position: absolute; bottom: 2.5%; left: 0; right: 0; text-align: center; color: #a99a8f; font-size: 10px; font-weight: 650; letter-spacing: .3em; text-transform: uppercase; animation: label-glow 4.8s ease-in-out infinite; }
    @keyframes aura { 0%,100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes breathe { 0%,100% { filter: drop-shadow(0 0 12px #ff4a1322) brightness(.98); transform: scale(.992); } 50% { filter: drop-shadow(0 0 35px #ff531066) brightness(1.08); transform: scale(1.008); } }
    @keyframes sweep { 0%,22% { left: -60%; opacity: 0; } 29% { opacity: .8; } 55% { left: 125%; opacity: .15; } 56%,100% { left: 125%; opacity: 0; } }
    @keyframes rise { 0% { transform: translate3d(0,0,0) scale(.65); opacity: 0; } 12% { opacity: .9; } 78% { opacity: .62; } 100% { transform: translate3d(25px,-55vh,0) scale(0); opacity: 0; } }
    @keyframes label-glow { 0%,100% { color: #82736a; text-shadow: 0 0 0 transparent; } 50% { color: #e2a06d; text-shadow: 0 0 15px #ff631d70; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: 18s !important; } }
  </style>
</head>
<body>
  <main class="scene" aria-label="Aetherion animiertes Logo">
    <div class="aura" aria-hidden="true"></div>
    <img class="logo" src="assets/aetherion-animated-logo.svg" alt="Aetherion Logo aus Stein und Feuer mit rotierendem Feuerring">
    <div class="sheen" aria-hidden="true"></div>
    <i class="ember" aria-hidden="true"></i><i class="ember" aria-hidden="true"></i>
    <i class="ember" aria-hidden="true"></i><i class="ember" aria-hidden="true"></i>
    <i class="ember" aria-hidden="true"></i><i class="ember" aria-hidden="true"></i>
    <i class="ember" aria-hidden="true"></i><i class="ember" aria-hidden="true"></i>
    <div class="label">Aetherion · Rise in fire</div>
  </main>
</body>
</html>
